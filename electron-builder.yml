appId: app.orzix.desktop
productName: orzix
copyright: © 2026 orzix

directories:
  output: desktop/dist
  buildResources: desktop

files:
  - desktop/main.js
  - desktop/api.js
  - desktop/native/*.js
  - desktop/app/**/*
  - package.json
  - node_modules/busboy/**/*
  - node_modules/streamsearch/**/*

# The bundled programs are copied beside the app rather than into the asar
# archive, because files inside an asar cannot be executed.
extraResources:
  - from: desktop/native
    to: native
    filter:
      - "**/*"
      - "!*.js"
      - "!README.md"

win:
  target: nsis
  icon: desktop/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target: dmg
  category: public.app-category.productivity
  icon: desktop/icon.png

linux:
  target: AppImage
  category: Office
  icon: desktop/icon.png
